name: Nothing Phone 3 Stock Tracker

on:
  schedule:
    # Runs every 15 minutes. GitHub may delay this during high load.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

concurrency:
  group: np3-tracker
  cancel-in-progress: false

permissions:
  contents: write   # needed so the workflow can commit state.json back

jobs:
  check-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          REMINDER_EVERY_N_RUNS: "0"
          TEST_MODE: "false"
        run: python tracker.py

      - name: Persist state
        run: |
          git config user.name "np3-tracker-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Update tracker state [skip ci]"
          git pull --rebase origin main
          git push
